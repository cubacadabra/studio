name: Release Cubacadabra Studio

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    uses: cubacadabra/tools/.github/workflows/native-release-reusable.yml@main
    with:
      app_repository: ${{ github.repository }}
      app_ref: ${{ github.ref_name }}
      app_directory: studio
      app_name: studio
      display_name: Cubacadabra Studio
      archive_prefix: cubacadabra-studio
      cargo_manifest: studio/Cargo.toml
      binary_name: studio
      rust_repository: cubacadabra/rust
      rust_ref: main
      tools_repository: cubacadabra/tools
      tools_ref: main
