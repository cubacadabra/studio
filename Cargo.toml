[package]
name = "cubacadabra-studio"
version = "0.0.2"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "studio"
path = "src/main.rs"

[dependencies]
cubacadabra-about-preview = { path = "../tools/crates/about-preview" }
cubacadabra-morph-authoring = { path = "crates/morph_authoring" }
cubacadabra-builder = { path = "../tools/crates/builder" }
cubacadabra-project = { path = "../tools/crates/project" }
cubacadabra-reference-import = { path = "../tools/crates/reference-import" }
cubacadabra-scene = { path = "../tools/crates/scene" }
cubacadabra-morphs = { path = "../rust/crates/morphs" }
cubacadabra-client = { path = "../rust/crates/client", features = ["desktop-backends", "studio-ui"] }
dirs = "6"
egui = "0.35"
egui_code_editor = "=0.3.7"
egui-wgpu = { version = "0.35", default-features = false }
egui-winit = "0.35"
env_logger = "0.11"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tungstenite = { version = "0.27", features = ["native-tls"] }
ureq = { version = "3", default-features = true }
url = "2"
winit = "0.30"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# Keep Linux builds independent of a system ALSA development package; the
# source browser reports audio preview as unavailable on that platform.
rodio = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAlert",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSString",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package.moxcms]
opt-level = 3

[dev-dependencies]
pollster = "0.4"
