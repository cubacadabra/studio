[package]
name = "cubacadabra-studio"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "studio"
path = "src/main.rs"

[dependencies]
cubacadabra-morphs = { path = "../rust/crates/morphs" }
cubacadabra-client = { path = "../rust/crates/client", features = ["desktop-backends", "studio-ui"] }
egui = "0.35"
egui-wgpu = { version = "0.35", default-features = false }
egui-winit = "0.35"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
tungstenite = { version = "0.27", features = ["native-tls"] }
url = "2"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSEvent",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSObject",
    "NSString",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
